name = "nishikawa-qa"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "nishikawa-qa-db"
database_id = "36effe0f-d78b-4da4-a859-b6a1033ec032"

[vars]
SITE_BASE_URL = "https://nishikawa-qa.pages.dev"
# RENDER_BACKEND_URL は、Renderのサービスを作った後、ここに追記して push する。

# INTERNAL_SHARED_KEY は秘密情報なので、ここには書かない。
# Cloudflareダッシュボードの Pages プロジェクト → Settings → Variables and secrets で
# Type=Secret として設定済み（セットアップ手順.md ステップ4）。
