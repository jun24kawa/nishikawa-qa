services:
  - type: web
    name: nishikawa-qa-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k gthread --threads 4 -t 120 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INTERNAL_SHARED_KEY
        sync: false
      - key: GMAIL_FROM
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
