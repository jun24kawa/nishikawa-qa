name = "nishikawa-qa"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "nishikawa-qa-db"
database_id = "ここに、D1データベース作成後に発行されるIDを入れる"

# 以下は秘密情報なので、この設定ファイルには書かない。
# Cloudflareダッシュボードの Pages プロジェクト → Settings → Environment variables で設定する：
#   RENDER_BACKEND_URL   例）https://nishikawa-qa-backend.onrender.com
#   INTERNAL_SHARED_KEY  Renderと共有する合言葉（Render側のINTERNAL_SHARED_KEYと同じ値）
#   SITE_BASE_URL        このサイト自身のURL（例）https://nishikawa-qa.pages.dev
